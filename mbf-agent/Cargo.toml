[package]
name = "mbf-agent"
version = "0.1.0"
edition = "2021"

[features]
request_timing = []

[dependencies]
mbf-res-man = { path = "../mbf-res-man" }
mbf-zip = { path = "../mbf-zip" }
mbf-axml = { path = "../mbf-axml" }
xml = "0.8.20"
anyhow = "1.0.86"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
ureq = "2.12.1"
log = "0.4.22"
# Used to format the patch date written into the patched APK in RFC 3339.
humantime = "2.1.0"
regex = "1.13.1"
